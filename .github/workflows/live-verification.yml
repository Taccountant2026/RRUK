name: Site health check
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public homepages
        shell: bash
        run: |
          set -euo pipefail
          check_site() {
            label="$1"
            url="$2"
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 25 "$url")"
            printf '%s: HTTP %s\n' "$label" "$code"
            test "$code" = "200"
          }
          check_site "RetroReplay UK" "https://retroreplay.uk/"
          check_site "Bytova" "https://bytova.co.uk/"
          check_site "Stone and Sprig" "https://taccountant2026.github.io/Turf-Right/"
