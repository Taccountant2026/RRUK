name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node --version
      - run: pnpm audit --audit-level high
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
